version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"

  app:
    build: .
    container_name: url-shortener
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB="db_name"
      - PORT="5000"
    depends_on:
      - mongodb
